name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Validate JavaScript
        run: |
          node --check admin.js
          node --check admin-config.js
          node --check admin-nav.js
          node --check contador.js
          node --check contador-tributario-loader.js
          node --check backend/server.js
          node --check assets/admin-enterprise/admin-supabase-singleton.js
          node --check assets/admin-enterprise/loader.js
          node --check assets/admin-enterprise/auth-policy.js
          node --check assets/admin-enterprise/invoice-edit.js
          node --check assets/admin-enterprise/project-reality.js
          node --check assets/admin-enterprise/record-manager.js
          node --check assets/admin-enterprise/commercial-documents.js
          node --check assets/admin-enterprise/agent-command-center.js
          node --check assets/admin-enterprise/dashboard-agents-stable.js
          node --check assets/admin-enterprise/mira-orchestrator-v7.js
          node --check assets/admin-enterprise/mira-persistent-doc-cache-v1.js
          node --check assets/admin-enterprise/admin-autosave-v1.js
          node --check assets/admin-enterprise/ceo-project-hub-loader.js

      - name: Validate enterprise bundle
        run: |
          cat assets/admin-enterprise/enterprise-1.b64 \
              assets/admin-enterprise/enterprise-2.b64 \
              assets/admin-enterprise/enterprise-3.b64 \
              assets/admin-enterprise/enterprise-4a.b64 \
              assets/admin-enterprise/enterprise-4b.b64 \
              assets/admin-enterprise/enterprise-4c.b64 > /tmp/admin-enterprise.b64
          base64 --decode /tmp/admin-enterprise.b64 | gzip --decompress > /tmp/admin-enterprise.js
          node --check /tmp/admin-enterprise.js
          grep -q "company_parties" /tmp/admin-enterprise.js
          grep -q "company_purchase_orders" /tmp/admin-enterprise.js
          grep -q "company_contracts" /tmp/admin-enterprise.js
          grep -q "company_transactions" /tmp/admin-enterprise.js
          grep -q "company_assets" /tmp/admin-enterprise.js
          grep -q "company_tax_records" /tmp/admin-enterprise.js
          grep -q "company_service_cases" /tmp/admin-enterprise.js
          grep -q "openTemplateManager" /tmp/admin-enterprise.js
          test -f assets/admin-enterprise/admin-supabase-singleton.js
          test -f assets/admin-enterprise/record-manager.js
          test -f assets/admin-enterprise/commercial-documents.js
          test -f assets/admin-enterprise/agent-command-center.js
          test -f assets/admin-enterprise/dashboard-agents-stable.js
          test -f assets/admin-enterprise/mira-orchestrator-v7.js
          test -f assets/admin-enterprise/mira-persistent-doc-cache-v1.js
          test -f assets/admin-enterprise/admin-autosave-v1.js
          grep -q "record-manager.js" assets/admin-enterprise/loader.js
          grep -q "commercial-documents.js" assets/admin-enterprise/loader.js
          grep -q "agent-command-center.js" assets/admin-enterprise/loader.js
          grep -q "mira-orchestrator-v7.js" assets/admin-enterprise/dashboard-agents-stable.js
          grep -q "mira-persistent-doc-cache-v1.js" assets/admin-enterprise/dashboard-agents-stable.js
          grep -q "admin-autosave-v1.js" assets/admin-enterprise/dashboard-agents-stable.js

      - name: Validate CEO project hub bundle
        run: |
          cat assets/admin-enterprise/ceo-project-hub-1.b64 \
              assets/admin-enterprise/ceo-project-hub-2.b64 \
              assets/admin-enterprise/ceo-project-hub-3.b64 \
              assets/admin-enterprise/ceo-project-hub-4.b64 > /tmp/ceo-project-hub.b64
          base64 --decode /tmp/ceo-project-hub.b64 | gzip --decompress > /tmp/ceo-project-hub.js
          node --check /tmp/ceo-project-hub.js
          grep -q "company_files" /tmp/ceo-project-hub.js
          grep -q "company_purchase_orders" /tmp/ceo-project-hub.js
          grep -q "company_invoices" /tmp/ceo-project-hub.js
          grep -q "/api/admin/mira" /tmp/ceo-project-hub.js
          grep -q "ChatPaper / MIRA" /tmp/ceo-project-hub.js
          grep -q "CEO_PORTFOLIO_META" /tmp/ceo-project-hub.js
          grep -q "admin-supabase-singleton.js" admin.html
          grep -q "ceo-project-hub-loader.js" admin.html
          grep -q "ceo-project-hub.css" admin.html
          ! grep -q "assets/admin-enterprise/loader.js" admin.html
          ! grep -q "assets/admin-enterprise/invoice-edit.js" admin.html
          ! grep -q "assets/admin-enterprise/dashboard-agents-stable.js" admin.html

      - name: Validate Contador IA bundle
        run: |
          cat assets/admin-enterprise/contador-1.b64 assets/admin-enterprise/contador-2.b64 > /tmp/contador.b64
          base64 --decode /tmp/contador.b64 | gzip --decompress > /tmp/contador-core.js
          node --check /tmp/contador-core.js
          grep -q "company_invoices" /tmp/contador-core.js
          grep -q "company_tax_records" /tmp/contador-core.js
          grep -q "company_files" /tmp/contador-core.js
          grep -q "/api/admin/mira" /tmp/contador-core.js
          grep -q "Contador Auditor" contador.html
          grep -q "MIRA Contable" contador.html
          grep -q "contador.html" admin.html

      - name: Validate Contador tributario bundle
        run: |
          cat assets/admin-enterprise/contador-tributario-1.b64 assets/admin-enterprise/contador-tributario-2.b64 > /tmp/contador-tributario.b64
          base64 --decode /tmp/contador-tributario.b64 | gzip --decompress > /tmp/contador-tributario.js
          node --check /tmp/contador-tributario.js
          grep -q "company_tax_records" /tmp/contador-tributario.js
          grep -q "company_bank_movements" /tmp/contador-tributario.js
          grep -q "company_invoices" /tmp/contador-tributario.js
          grep -q "/api/admin/mira" /tmp/contador-tributario.js
          grep -q "f29_precheck" /tmp/contador-tributario.js
          grep -q 'rcv_${book}' /tmp/contador-tributario.js
          grep -q "contador-tributario-loader.js" contador.html
          grep -q "contador-tributario.css" contador.html
          grep -q "RCV / SII" contador.html
          grep -q "F29 y PPM" contador.html
          grep -q "Conciliación bancaria" contador.html

      - name: Validate responsive screen bands
        run: |
          test -f responsive-admin-suite.css
          test -f contador-shell-fix.css
          grep -q "min-width:1440px" responsive-admin-suite.css
          grep -q "min-width:921px" responsive-admin-suite.css
          grep -q "max-width:920px" responsive-admin-suite.css
          grep -q "max-width:767px" responsive-admin-suite.css
          grep -q "max-width:480px" responsive-admin-suite.css
          grep -q "responsive-admin-suite.css" admin.html
          grep -q "responsive-admin-suite.css" contador.html
          grep -q "contador-shell-fix.css" contador.html
          grep -q "grid-column:2" contador-shell-fix.css
          grep -q "backdrop.show" contador-shell-fix.css

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R assets _site/assets
          cp documentos.html index.html innova-space-track.html innova-measure-ai.html innova-measure-ai.css innova-measure-ai.js legal.css legal.js main.js mira-voice-controller.js speak.js style.css admin.html admin.css admin.js admin-config.js admin-nav.js contador.html contador.css contador.js contador-tributario.css contador-tributario-loader.js responsive-admin-suite.css contador-shell-fix.css _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
